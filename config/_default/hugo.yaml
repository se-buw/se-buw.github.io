# Configuration of Hugo
# Theme: Hextra (https://imfing.github.io/hextra/docs/)
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

title: "SE@BUW"
baseURL: 'https://se-buw.de/'

############################
## PAGE OPTIONS
############################

cascade:
  # Generative Software Engineering tutorials: Hextra docs layout (sidebar, TOC, prev/next)
  - target:
      path: '{/teaching/gse,/teaching/gse/**}'
    type: docs
  # News: Hextra blog layout
  - target:
      path: '{/news,/news/**}'
    type: blog
  # Publication pages: Hextra blog layout (the publication list has its own layout)
  - target:
      path: /publication/**
      kind: page
    type: blog

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

enableGitInfo: false
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
enableInlineShortcodes: true
permalinks:
  authors: '/author/:slug/'
  tags: '/tag/:slug/'
  categories: '/category/:slug/'
disableAliases: true
outputs:
  home: [HTML, RSS]
  page: [HTML]
  section: [HTML, RSS]
imaging:
  resampleFilter: Lanczos
  anchor: Smart
  jpeg:
    quality: 90
  webp:
    quality: 90
timeout: "600s"
taxonomies:
  tag: tags
  category: categories
  author: authors
markup:
  goldmark:
    renderer:
      # Render HTML in Markdown
      unsafe: true
    parser:
      attribute:
        block: true
        title: true
    extensions:
      extras:
        # Enable subscript, superscript, and highlighting with ~,^, and == wrappers
        mark:
          enable: true
        subscript:
          enable: true
        superscript:
          enable: true
  highlight:
    noClasses: false
    guessSyntax: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
related:
  threshold: 80
  includeNewer: true
  toLower: true
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 70
security:
  exec:
    allow: ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^node$', '^npx$', '^postcss$']
