# SITE SETUP
# Theme documentation: https://imfing.github.io/hextra/docs/guide/configuration/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

description: 'Software Engineering Chair at Bauhaus-Universität Weimar: model-based software development, formal methods and reactive synthesis.'

# Site header
navbar:
  displayTitle: true
  displayLogo: true
  logo:
    path: images/icon.png
    width: 32
    height: 32
  width: full

# Light / dark mode: light | dark | system
theme:
  default: dark
  # The toggle is in the navbar menu (see menus.yaml)
  displayToggle: false

# Site footer: the copyright notice is in layouts/_partials/custom/footer.html
footer:
  enable: true
  displayCopyright: false
  displayPoweredBy: false
  width: full
copyright: '© {year} Software Engineering @ Bauhaus-Universität Weimar. All rights reserved.'

page:
  width: wide

dateFormat: 'Jan 2, 2006'
displayUpdatedDate: true

# Search (built into the theme, indexes the Hugo pages but not the static slide decks)
search:
  enable: true
  type: flexsearch
  flexsearch:
    index: content
    tokenize: forward

highlight:
  copy:
    enable: true
    display: hover

imageZoom:
  enable: true

externalLinkDecoration: false

blog:
  list:
    displayTags: true
    sortBy: date
    sortOrder: desc
  article:
    displayPagination: true

# Source repository, used by the sub-code shortcode for links to source files
repository:
  url: 'https://github.com/se-buw/se-buw.github.io/'
  branch: 'main'
