name: Deploy website to GitHub Pages

env:
  WC_HUGO_VERSION: "0.148.2"

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Provide permission to clone the repo and deploy it to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build website
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Fetch history for Hugo's .GitInfo and .Lastmod
          submodules: true
          fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true
      - uses: actions/cache@v5
        with:
          path: /tmp/hugo_cache_runner/
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - name: Install TailwindCSS CLI
        run: npm install

      ######## BLOCKLY-INTRO #######
      - name: Build blockly-intro examples
        working-directory: code-examples/blockly-intro
        run: |
          npm install
          npm run build
      - name: Clean and copy blockly-intro dist
        run: |
          mkdir -p static/teaching/gse/tutorials/blockly/dist
          for project in "01.helloBlock" "02.helloBlocks" "03.turtle"; do
            src="code-examples/blockly-intro/$project/dist"
            dest="static/teaching/gse/tutorials/blockly/dist/$project"
            if [ -d "$src" ]; then
              rm -rf "$dest"
              cp -r "$src" "$dest"
            fi
          done

      ####### XTEXT-INTRO #######
      - name: Clean and copy xtext-intro simulation
        run: |
          src="code-examples/xtext-intro/03.turtle/simulation"
          dest="static/teaching/gse/tutorials/xtext/03.turtle/simulation"

          mkdir -p "$(dirname "$dest")"

          if [ -d "$src" ]; then
            rm -rf "$dest"
            cp -r "$src" "$dest"
          else
            echo "Warning: Source directory $src not found."
          fi

      - name: Minify xtext-intro simulation assets
        run: |
          target_dir="static/teaching/gse/tutorials/xtext/03.turtle/simulation"

          if [ -f "$target_dir/index.html" ]; then
            npx -y html-minifier-terser --collapse-whitespace --remove-comments --minify-css --minify-js -o "$target_dir/index.html" "$target_dir/index.html"
          fi

          for js_file in "$target_dir"/assets/*.js; do
            if [ -f "$js_file" ]; then
              npx -y terser "$js_file" -o "$js_file" --compress --mangle
            fi
          done
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Index with Pagefind
        run: npx pagefind --site public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # Deploy website to GitHub Pages hosting
  deploy:
    if: github.repository_owner != 'HugoBlox'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
