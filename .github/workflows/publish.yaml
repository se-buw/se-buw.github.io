name: Deploy website to GitHub Pages

env:
  WC_HUGO_VERSION: "0.166.0"

on:
  # Trigger the workflow every time you push to the `main` branch
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  # se-buw/intro-java starts it after a push, with the run whose slides to publish.
  workflow_dispatch:
    inputs:
      intro_java_run:
        description: "Run of se-buw/intro-java whose slides to publish (default: latest successful)"
        required: false

# Provide permission to clone the repo and deploy it to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build website
  build:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Fetch history for Hugo's .GitInfo and .Lastmod
          submodules: true
          fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.WC_HUGO_VERSION }}
          extended: true
      - uses: actions/cache@v5
        with:
          path: /tmp/hugo_cache_runner/
          key: ${{ runner.os }}-hugomod-${{ hashFiles('**/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-hugomod-
      # Node is only needed to build the Blockly and Xtext examples
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Execute the external build script for blockly
      - name: Build and copy Blockly examples
        run: bash scripts/build_blockly_examples.sh

      # Execute the external build script for xtext
      - name: Build and copy Xtext examples
        run: bash scripts/build_xtext_examples.sh

      # The released slides of se-buw/intro-java: artifact of its build, to /teaching/intro-java/slides/.
      # Secret SE_BUW_SITE_TOKEN: fine-grained token with Actions read on se-buw/intro-java
      # (the same token lets intro-java start this workflow: Actions read/write on this repository).
      - name: Fetch intro-java slides
        env:
          GH_TOKEN: ${{ secrets.SE_BUW_SITE_TOKEN }}
          INTRO_JAVA_RUN: ${{ inputs.intro_java_run }}
        run: bash scripts/fetch_intro_java_slides.sh

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        run: |
          echo "Hugo Cache Dir: $(hugo config | grep cachedir)"
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # Deploy website to GitHub Pages hosting
  deploy:
    if: github.repository_owner != 'HugoBlox'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5